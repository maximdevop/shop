 return '<article class="card'+(out?' out':'')+'">'+open+pic+b+(p.img?'</a>':'</div>')+'<div class="info"><div class="name">'+esc(n)+'</div><div class="desc">'+esc(p["d"+lang])+'</div>'+(m?'<div class="mat">'+t.mat+esc(m)+'</div>':'')+'<div class="stock">'+(out?t.out:t.in)+'</div><div class="row"><span class="price">'+p.price+' '+PRICE_SUFFIX[lang]+'</span><a class="btn ghost" target="_blank" rel="noopener" href="'+tg((out?t.mo:t.msg)+n)+'">'+(out?t.ask:t.order)+'</a></div></div></article>';
}
function drawGrid(){
 VISIBLE=vis();
 document.getElementById("grid").innerHTML=VISIBLE.map(function(i,k){return card(i,k);}).join("");
 document.getElementById("cnt").textContent=T[lang].n+VISIBLE.length;
 document.querySelectorAll(".pic.has").forEach(function(el){el.addEventListener("click",function(e){e.preventDefault();if(window.openPhoto)window.openPhoto(+el.dataset.i);});});
}
function drawChips(){
 var t=T[lang],h='<button type="button" class="chip" data-c="all" aria-pressed="'+(cat==="all")+'">'+t.all+'</button>';
 CATS.forEach(function(c){if(PRODUCTS.some(function(p){return p.cat===c.k;}))h+='<button type="button" class="chip" data-c="'+c.k+'" aria-pressed="'+(cat===c.k)+'">'+esc(c[lang])+'</button>';});
 document.getElementById("chips").innerHTML=h;
}
function render(){
 var t=T[lang];document.documentElement.lang=lang;
 document.getElementById("shopName").textContent=SHOP_NAME;
 document.getElementById("t1").textContent=t.h1;document.getElementById("t2").textContent=t.p;
 document.getElementById("t3").textContent=t.c;document.getElementById("t4").textContent=t.cp;
 ["cta1","cta2"].forEach(function(id){var a=document.getElementById(id);a.textContent=t.cta;a.href=tg("");});
 var vb=document.getElementById("vb"),ig=document.getElementById("ig");
 vb.hidden=!VIBER;if(VIBER){vb.href="viber://chat?number="+encodeURIComponent(VIBER);vb.textContent="Viber";}
 ig.hidden=!INSTAGRAM;if(INSTAGRAM){ig.href="https://instagram.com/"+encodeURIComponent(INSTAGRAM);ig.textContent="Instagram";}
 var d=DELIVERY[lang];document.getElementById("t5").textContent=d.title;
 document.getElementById("i3").innerHTML=d.items.map(function(x){return '<div><h3>'+esc(x.h)+'</h3><p>'+esc(x.t)+'</p></div>';}).join("");
 var so=document.getElementById("sort");so.setAttribute("aria-label",t.sl);
 so.innerHTML=[["def",t.sd],["asc",t.sa],["desc",t.sh]].map(function(o){return '<option value="'+o[0]+'"'+(o[0]===sort?" selected":"")+'>'+o[1]+'</option>';}).join("");
 drawChips();drawGrid();themeBtn();
 document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===lang?"true":"false");});
}
document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){lang=b.dataset.l;try{localStorage.setItem("lang",lang);}catch(e){}render();});});
/* ===== Просмотр фото с зумом / Vizualizare foto cu zoom ===== */
(function(){
 var lb=document.getElementById("lb"),stage=document.getElementById("lbStage"),img=document.getElementById("lbImg");
 var cap=document.getElementById("lbCap"),order=document.getElementById("lbOrder"),hint=document.getElementById("lbHint");
 var MAX=5,cur=-1,s=1,tx=0,ty=0,pts={},pinch=null,pan=null,swipe=null,lastTap=0,lastX=0,lastY=0,pushed=false,lastFocus=null,hintTimer;
 function list(){var a=[];VISIBLE.forEach(function(i){if(PRODUCTS[i].img)a.push(i);});return a;}
 function apply(anim){img.classList.toggle("anim",!!anim);img.style.transform="translate("+tx+"px,"+ty+"px) scale("+s+")";}
 function clamp(){var w=img.offsetWidth*s,h=img.offsetHeight*s,mx=Math.max(0,(w-innerWidth)/2),my=Math.max(0,(h-innerHeight)/2);tx=Math.min(mx,Math.max(-mx,tx));ty=Math.min(my,Math.max(-my,ty));}
 function reset(anim){s=1;tx=0;ty=0;apply(anim);}
 function zoomAt(ns,px,py,anim){ns=Math.min(MAX,Math.max(1,ns));var cx=px-innerWidth/2,cy=py-innerHeight/2;tx=cx-(cx-tx)*ns/s;ty=cy-(cy-ty)*ns/s;s=ns;clamp();apply(anim);}
 function show(i){
  cur=i;var p=PRODUCTS[i],t=T[lang];reset(false);
  img.src=p.img;img.alt=p[lang];
  cap.innerHTML=esc(p[lang])+"<small>"+p.price+" "+PRICE_SUFFIX[lang]+"</small>";
  order.textContent=t.order;order.href=tg(t.msg+p[lang]);
  var n=list().length;document.getElementById("lbPrev").hidden=document.getElementById("lbNext").hidden=n<2;
 }
 function step(d){var a=list(),k=a.indexOf(cur);if(a.length<2)return;show(a[(k+d+a.length)%a.length]);}
 function open(i){
  lastFocus=document.activeElement;show(i);lb.hidden=false;lb.classList.add("open");document.body.style.overflow="hidden";
  hint.textContent=T[lang].hint;hint.style.opacity=1;clearTimeout(hintTimer);hintTimer=setTimeout(function(){hint.style.opacity=0;},2500);
  try{history.pushState({lb:1},"");pushed=true;}catch(e){pushed=false;}
  document.getElementById("lbClose").focus();
 }
 function hide(){if(lb.hidden)return;lb.classList.remove("open");lb.hidden=true;document.body.style.overflow="";pts={};pinch=pan=swipe=null;pushed=false;if(lastFocus&&lastFocus.focus)lastFocus.focus();}
 function close(){if(pushed&&history.state&&history.state.lb){history.back();}else hide();}
 window.addEventListener("popstate",hide);
 window.openPhoto=open;
 document.getElementById("lbClose").onclick=close;
 document.getElementById("lbPrev").onclick=function(){step(-1);};
 document.getElementById("lbNext").onclick=function(){step(1);};
 document.addEventListener("keydown",function(e){if(lb.hidden)return;if(e.key==="Escape")close();else if(e.key==="ArrowLeft")step(-1);else if(e.key==="ArrowRight")step(1);else if(e.key==="+"||e.key==="=")zoomAt(s*1.5,innerWidth/2,innerHeight/2,true);else if(e.key==="-")zoomAt(s/1.5,innerWidth/2,innerHeight/2,true);});
 stage.addEventListener("wheel",function(e){e.preventDefault();zoomAt(s*Math.exp(-e.deltaY*0.0025),e.clientX,e.clientY,false);},{passive:false});
 function two(){var k=Object.keys(pts),a=pts[k[0]],b=pts[k[1]];return {d:Math.hypot(a.x-b.x,a.y-b.y)||1,x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
 stage.addEventListener("pointerdown",function(e){
  pts[e.pointerId]={x:e.clientX,y:e.clientY};try{stage.setPointerCapture(e.pointerId);}catch(_){}
  var n=Object.keys(pts).length;
  if(n===2){var g=two();pinch={d:g.d,x:g.x,y:g.y,s:s,tx:tx,ty:ty};pan=null;swipe=null;}
  else if(n===1){pan={x:e.clientX,y:e.clientY};swipe={x:e.clientX,y:e.clientY,t:Date.now(),moved:false,onImg:hitImg(e.clientX,e.clientY)};}
  img.classList.remove("anim");
 });
 function hitImg(x,y){var r=img.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;}
 stage.addEventListener("pointermove",function(e){
  if(!pts[e.pointerId])return;pts[e.pointerId]={x:e.clientX,y:e.clientY};
  if(pinch&&Object.keys(pts).length>=2){
   var g=two(),ns=Math.min(MAX,Math.max(1,pinch.s*g.d/pinch.d)),cx=pinch.x-innerWidth/2,cy=pinch.y-innerHeight/2;
   tx=cx-(cx-pinch.tx)*ns/pinch.s+(g.x-pinch.x);ty=cy-(cy-pinch.ty)*ns/pinch.s+(g.y-pinch.y);s=ns;clamp();apply(false);return;
  }
  if(!pan)return;
  var dx=e.clientX-pan.x,dy=e.clientY-pan.y;pan.x=e.clientX;pan.y=e.clientY;
  if(swipe&&Math.hypot(e.clientX-swipe.x,e.clientY-swipe.y)>8)swipe.moved=true;
  if(s>1.01){tx+=dx;ty+=dy;clamp();apply(false);}
  else if(swipe){var sx=e.clientX-swipe.x,sy=e.clientY-swipe.y;if(Math.abs(sx)>Math.abs(sy)){tx=sx;ty=0;}else{tx=0;ty=Math.max(0,sy);}apply(false);}
 });
 function end(e){
  if(!pts[e.pointerId])return;delete pts[e.pointerId];
  var left=Object.keys(pts);
  if(pinch){if(left.length<2){pinch=null;if(left.length===1){var p=pts[left[0]];pan={x:p.x,y:p.y};}swipe=null;if(s<1.05)reset(true);}return;}
  if(left.length)return;
  var sw=swipe;pan=null;swipe=null;
  if(!sw)return;
  if(!sw.moved&&Date.now()-sw.t<350){
   var now=Date.now();
   if(now-lastTap<320&&Math.hypot(e.clientX-lastX,e.clientY-lastY)<40){lastTap=0;if(s>1.01)reset(true);else zoomAt(2.5,e.clientX,e.clientY,true);return;}
   lastTap=now;lastX=e.clientX;lastY=e.clientY;
   if(!sw.onImg&&s<=1.01){setTimeout(function(){if(lastTap===now)close();},330);}
   return;
  }
  if(s<=1.01){
   var dx=e.clientX-sw.x,dy=e.clientY-sw.y;
   if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){step(dx<0?1:-1);return;}
   if(dy>110&&Math.abs(dy)>Math.abs(dx)){reset(false);close();return;}
   reset(true);
  }
 }
 stage.addEventListener("pointerup",end);stage.addEventListener("pointercancel",end);
 document.addEventListener("gesturestart",function(e){if(!lb.hidden)e.preventDefault();});
 window.addEventListener("resize",function(){if(!lb.hidden){clamp();apply(false);}});
})();

var MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function effTheme(){var d=document.documentElement.getAttribute("data-theme");if(d)return d;return window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}
function themeBtn(){var b=document.getElementById("themeBtn"),dk=effTheme()==="dark";b.innerHTML=dk?SUN:MOON;b.setAttribute("aria-label",dk?T[lang].tl:T[lang].td);}
document.getElementById("themeBtn").addEventListener("click",function(){var n=effTheme()==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem("theme",n);}catch(e){}themeBtn();});
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",themeBtn);}catch(e){}
document.getElementById("chips").addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;cat=b.dataset.c;document.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",c===b?"true":"false");});drawGrid();});
document.getElementById("sort").addEventListener("change",function(){sort=this.value;drawGrid();});
render();
</script>
